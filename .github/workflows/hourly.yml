name: Codex Changelog Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-changelog-hourly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Install Claude CLI
        run: bun add -g @anthropic-ai/claude-code

      - name: Add Bun global bin to PATH
        run: echo "${HOME}/.bun/bin" >> "$GITHUB_PATH"

      - name: Generate post + update state
        run: |
          set -euo pipefail
          bun run index.ts > /tmp/post.txt
          echo "Generated post:"
          cat /tmp/post.txt
        env:
          CLAUDE_BINARY: ${{ env.HOME }}/.bun/bin/claude
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      - name: Check state change
        id: state_check
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- .state/last_posted_tag.txt)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit state
        if: steps.state_check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/last_posted_tag.txt
          tag="$(cat .state/last_posted_tag.txt)"
          git commit -m "chore(state): update last posted tag to ${tag}"
          git push

      - name: Step summary
        run: |
          echo "### Post text" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/post.txt >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "state changed: ${{ steps.state_check.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
